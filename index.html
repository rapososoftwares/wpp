<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Telefone - WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: #075E54;
            color: white;
            padding: 8px;
            text-align: center;
        }

        .header h1 {
            font-size: 16px;
            margin-bottom: 2px;
        }

        .header p {
            font-size: 11px;
            opacity: 0.9;
        }

        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/2.2;
            background: #000;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas {
            display: none;
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 40%;
            border: 4px solid #25D366;
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7);
        }

        .overlay::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 2px solid rgba(37, 211, 102, 0.5);
            border-radius: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .overlay-text {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 10px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 5px 10px;
            border-radius: 12px;
            white-space: nowrap;
            font-weight: 600;
        }

        .controls {
            padding: 8px;
        }

        .btn {
            width: 100%;
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 5px;
        }

        .btn-capture {
            background: #25D366;
            color: white;
        }

        .btn-capture:active {
            background: #1DA851;
            transform: scale(0.98);
        }

        .btn-capture:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #666;
            color: white;
        }

        .btn-secondary:active {
            background: #444;
            transform: scale(0.98);
        }

        .result {
            padding: 8px;
            background: #F0F2F5;
            display: none;
        }

        .result.show {
            display: block;
        }

        .phone-display {
            background: white;
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 5px;
            border: 2px solid #25D366;
        }

        .phone-label {
            font-size: 10px;
            color: #666;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .edit-link {
            color: #128C7E;
            font-weight: 700;
            cursor: pointer;
            font-size: 11px;
        }

        .phone-number {
            font-size: 16px;
            font-weight: 700;
            color: #075E54;
            letter-spacing: 0.5px;
        }

        #phoneInput {
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            color: #075E54;
            padding: 6px;
            border-radius: 6px;
            border: 2px solid #25D366;
            display: none;
            margin-bottom: 5px;
        }

        #saveEditBtn {
            display: none;
        }

        .manual-entry {
            padding: 8px;
            background: #F0F2F5;
            display: none;
        }

        .manual-entry input {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border-radius: 6px;
            border: 2px solid #25D366;
            margin-bottom: 5px;
        }

        .period-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-bottom: 5px;
        }

        .btn-period {
            background: linear-gradient(135deg, #25D366 0%, #20BA5A 100%);
            color: white;
            padding: 6px 4px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .btn-period:active {
            transform: scale(0.95);
            background: linear-gradient(135deg, #1DA851 0%, #188F4A 100%);
        }

        .btn-period .icon {
            font-size: 16px;
        }

        .btn-period.morning {
            background: linear-gradient(135deg, #FFB84D 0%, #FF9500 100%);
        }

        .btn-period.morning:active {
            background: linear-gradient(135deg, #FF9500 0%, #E88500 100%);
        }

        .btn-period.afternoon {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
        }

        .btn-period.afternoon:active {
            background: linear-gradient(135deg, #357ABD 0%, #2868AB 100%);
        }

        .btn-period.start-chat {
            background: linear-gradient(135deg, #25D366 0%, #20BA5A 100%);
        }

        .btn-period.start-chat:active {
            background: linear-gradient(135deg, #1DA851 0%, #188F4A 100%);
        }

        .btn-period.call-btn {
            background: linear-gradient(135deg, #34B7F1 0%, #1E88E5 100%);
        }

        .btn-period.call-btn:active {
            background: linear-gradient(135deg, #1E88E5 0%, #1565C0 100%);
        }

        .status {
            text-align: center;
            padding: 5px;
            font-size: 11px;
            color: #666;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 15px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #25D366;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #FFEBEE;
            color: #C62828;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 5px;
            display: none;
            font-size: 12px;
        }

        .error.show {
            display: block;
        }

        .divider {
            text-align: center;
            color: #999;
            font-size: 10px;
            margin: 5px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #ddd;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Scanner Electrolux</h1>
            <p>Escaneie o número da nota fiscal</p>
        </div>

        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="overlay">
                <div class="overlay-text">📱 Posicione apenas o NÚMERO aqui</div>
            </div>
        </div>

        <div class="controls">
            <div class="error" id="error"></div>
            <button class="btn btn-capture" id="captureBtn">
                📸 Capturar e Escanear
            </button>
            <button class="btn btn-secondary" id="manualBtn">
                ✏️ Digitar Número Manualmente
            </button>
            <div class="status" id="status">Câmera pronta</div>
        </div>

        <div class="manual-entry" id="manualEntry">
            <input type="tel" id="manualPhoneInput" placeholder="Ex: 41999998888 (com DDD)">
            <button class="btn btn-capture" id="confirmManualBtn">Confirmar Número</button>
            <button class="btn btn-secondary" id="cancelManualBtn">Cancelar</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p id="loadingText">Carregando...</p>
        </div>

        <div class="result" id="result">
            <div class="phone-display">
                <div class="phone-label">
                    <span>Número detectado:</span>
                    <span class="edit-link" id="editLink">✏️ Editar</span>
                </div>
                <div class="phone-number" id="phoneNumber"></div>
                <input type="tel" id="phoneInput" placeholder="Ex: 41999998888 (com DDD)">
                <button class="btn btn-capture" id="saveEditBtn">Salvar</button>
            </div>
            
            <div class="period-buttons">
                <button class="btn-period morning" id="morningBtn">
                    <span class="icon">🌅</span>
                    <span>MANHÃ</span>
                </button>
                <button class="btn-period afternoon" id="afternoonBtn">
                    <span class="icon">🌆</span>
                    <span>TARDE</span>
                </button>
            </div>
            
            <button class="btn-period start-chat" id="startChatBtn" style="margin-top: 5px; width: 100%;">
                <span class="icon">💬</span>
                <span>Iniciar Conversa</span>
            </button>
            
            <button class="btn-period call-btn" id="callBtn" style="margin-top: 5px; width: 100%;">
                <span class="icon">📞</span>
                <span>LIGAR</span>
            </button>
            
            <div class="divider">OU</div>
            
            <button class="btn" style="background: #666; color: white;" id="newScanBtn">
                🔄 Escanear Outro Número
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const manualBtn = document.getElementById('manualBtn');
        const manualEntry = document.getElementById('manualEntry');
        const manualPhoneInput = document.getElementById('manualPhoneInput');
        const confirmManualBtn = document.getElementById('confirmManualBtn');
        const cancelManualBtn = document.getElementById('cancelManualBtn');
        const status = document.getElementById('status');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const result = document.getElementById('result');
        const phoneNumber = document.getElementById('phoneNumber');
        const phoneInput = document.getElementById('phoneInput');
        const editLink = document.getElementById('editLink');
        const saveEditBtn = document.getElementById('saveEditBtn');
        const morningBtn = document.getElementById('morningBtn');
        const afternoonBtn = document.getElementById('afternoonBtn');
        const startChatBtn = document.getElementById('startChatBtn');
        const callBtn = document.getElementById('callBtn');
        const newScanBtn = document.getElementById('newScanBtn');
        const errorDiv = document.getElementById('error');

        let detectedPhone = '';
        let worker = null;

        // 4 variações por período para evitar padrão idêntico de mensagem (anti-spam/anti-banimento)
        const messages = {
            morning: [
`Olá! 😊

Sou da AZ Logística e serei o responsável pela entrega do seu produto Electrolux.

A entrega está prevista para o período da manhã.
Não conseguimos informar um horário exato, pois ele pode variar conforme o roteiro de entregas, trânsito e outros fatores.

Pedimos a gentileza de manter uma pessoa maior de idade no local para receber e assinar o documento de entrega.

Agradeço pela compreensão! 🚚`,
`Bom dia!

Pedimos que tenha alguém disponível no endereço para receber o produto.

Qualquer dúvida, estou à disposição. Obrigado! 📦`,
`Olá, tudo bem?
Sou o entregador responsável pelo seu pedido Electrolux hoje.

A entrega ocorrerá no período da manhã, dentro da nossa rota de hoje.

Por favor, garanta que haja alguém no local para receber a mercadoria.

Agradeço a atenção! 🙏`,
`Oi! Passando para avisar que sua entrega Electrolux está confirmada para o período da manhã de hoje.

O horário exato pode variar conforme o trânsito e a ordem das entregas da rota.

Pedimos que alguém esteja disponível para receber e assinar o comprovante.

Obrigado pela parceria! 🚛`
            ],
            afternoon: [
`Olá! 😊

Sou da AZ Logística e serei o responsável pela entrega do seu produto Electrolux.

A entrega está prevista para o período da tarde.
Não conseguimos informar um horário exato, pois ele pode variar conforme o roteiro de entregas, trânsito e outros fatores.

Pedimos a gentileza de manter uma pessoa maior de idade no local para receber e assinar o documento de entrega.

Agradeço pela compreensão! 🚚`,
`Boa tarde!
Aqui é da equipe de entregas da Electrolux, via AZ Logística.

Sua entrega está agendada para hoje, no período da tarde.

Pedimos que tenha alguém disponível no endereço para receber o produto.

Qualquer dúvida, estou à disposição. Obrigado! 📦`,
`Olá, tudo bem?
Sou o entregador responsável pelo seu pedido Electrolux hoje.

A entrega ocorrerá no período da tarde, dentro da nossa rota de hoje.

Por favor, garanta que haja alguém no local para receber a mercadoria.

Agradeço a atenção! 🙏`,
`Oi! Passando para avisar que sua entrega Electrolux está confirmada para o período da tarde de hoje.

O horário exato pode variar conforme o trânsito e a ordem das entregas da rota.

Pedimos que alguém esteja disponível para receber e assinar o comprovante.

Obrigado pela parceria! 🚛`
            ]
        };

        function getRandomMessage(period) {
            const arr = messages[period];
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Inicializar Tesseract
        async function initTesseract() {
            try {
                loadingText.textContent = 'Inicializando scanner...';
                loading.classList.add('show');
                
                worker = await Tesseract.createWorker('eng', 1, {
                    logger: m => {
                        if (m.status === 'loading tesseract core') {
                            loadingText.textContent = 'Carregando motor OCR...';
                        } else if (m.status === 'initializing tesseract') {
                            loadingText.textContent = 'Inicializando...';
                        } else if (m.status === 'loading language traineddata') {
                            loadingText.textContent = 'Carregando idioma...';
                        } else if (m.status === 'initializing api') {
                            loadingText.textContent = 'Preparando API...';
                        }
                    }
                });
                
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789()- ',
                });
                
                loading.classList.remove('show');
                status.textContent = 'Scanner pronto!';
            } catch (err) {
                console.error('Erro ao inicializar Tesseract:', err);
                showError('Erro ao carregar scanner. Recarregue a página.');
                loading.classList.remove('show');
            }
        }

        // Iniciar câmera
        async function startCamera() {
            try {
                // Para qualquer stream anterior
                if (video.srcObject) {
                    const tracks = video.srcObject.getTracks();
                    tracks.forEach(track => track.stop());
                    video.srcObject = null;
                }
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
                video.srcObject = stream;
                captureBtn.disabled = false;
                status.textContent = 'Câmera pronta';
            } catch (err) {
                showError('Erro ao acessar câmera: ' + err.message);
                captureBtn.disabled = true;
            }
        }

        // Reativar câmera quando voltar ao app
        document.addEventListener('visibilitychange', async () => {
            if (!document.hidden) {
                if (video.srcObject) {
                    const tracks = video.srcObject.getVideoTracks();
                    if (tracks.length > 0 && tracks[0].readyState === 'live') {
                        return;
                    }
                }
                await startCamera();
            }
        });

        // Indicador visual de foco
        const cameraContainer = document.querySelector('.camera-container');
        function showFocusIndicator(x, y) {
            let indicator = document.getElementById('focusIndicator');
            if (!indicator) {
                indicator = document.createElement('div');
                indicator.id = 'focusIndicator';
                indicator.style.cssText = `
                    position:absolute;width:60px;height:60px;
                    border:2px solid #fff;border-radius:4px;
                    pointer-events:none;transform:translate(-50%,-50%);
                    z-index:10;box-shadow:0 0 0 1px rgba(0,0,0,0.5);
                    transition:opacity 0.5s;
                `;
                cameraContainer.appendChild(indicator);
            }
            indicator.style.left = x + 'px';
            indicator.style.top = y + 'px';
            indicator.style.opacity = '1';
            clearTimeout(indicator._timeout);
            indicator._timeout = setTimeout(() => { indicator.style.opacity = '0'; }, 1500);
        }

        // Foco ao tocar na tela da câmera
        cameraContainer.addEventListener('click', async (e) => {
            const track = video.srcObject && video.srcObject.getVideoTracks()[0];
            if (!track) return;
            const rect = cameraContainer.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            showFocusIndicator(e.clientX - rect.left, e.clientY - rect.top);
            try {
                await track.applyConstraints({
                    advanced: [{ focusMode: 'manual', pointsOfInterest: [{ x, y }] }]
                });
                setTimeout(() => {
                    track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
                }, 2000);
            } catch (err) {
                console.log('Foco manual não suportado:', err.message);
            }
        });

        // Capturar imagem
        captureBtn.addEventListener('click', async () => {
            if (!worker) {
                showError('Scanner ainda não está pronto. Aguarde...');
                return;
            }

            const videoRect = video.getBoundingClientRect();
            const displayW = videoRect.width;
            const displayH = videoRect.height;

            const videoW = video.videoWidth;
            const videoH = video.videoHeight;

            const scale = Math.max(displayW / videoW, displayH / videoH);

            const renderedW = videoW * scale;
            const renderedH = videoH * scale;

            const offsetX = (renderedW - displayW) / 2;
            const offsetY = (renderedH - displayH) / 2;

            const margin = 10;
            const overlayDisplayX = displayW * 0.15 + margin;
            const overlayDisplayY = displayH * 0.30 + margin;
            const overlayDisplayW = displayW * 0.70 - margin * 2;
            const overlayDisplayH = displayH * 0.40 - margin * 2;

            const cropX = (overlayDisplayX + offsetX) / scale;
            const cropY = (overlayDisplayY + offsetY) / scale;
            const cropW = overlayDisplayW / scale;
            const cropH = overlayDisplayH / scale;

            const upscale = 2.5;
            canvas.width = cropW * upscale;
            canvas.height = cropH * upscale;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            ctx.drawImage(
                video,
                cropX, cropY,
                cropW, cropH,
                0, 0,
                canvas.width, canvas.height
            );

            const imageDataObj = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imageDataObj.data;
            for (let i = 0; i < d.length; i += 4) {
                const avg = (d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114);
                const v = avg > 140 ? 255 : 0;
                d[i] = d[i+1] = d[i+2] = v;
            }
            ctx.putImageData(imageDataObj, 0, 0);

            loading.classList.add('show');
            loadingText.textContent = 'Processando imagem...';
            captureBtn.disabled = true;
            errorDiv.classList.remove('show');

            try {
                const imageData = canvas.toDataURL('image/png');
                await recognizePhone(imageData);
            } catch (err) {
                console.error('Erro ao processar:', err);
                showError('Erro ao processar imagem. Tente novamente.');
                loading.classList.remove('show');
                captureBtn.disabled = false;
            }
        });

        // Reconhecer número de telefone
        async function recognizePhone(imageData) {
            try {
                loadingText.textContent = 'Escaneando texto...';
                
                const { data: { text } } = await worker.recognize(imageData);
                
                console.log('Texto detectado:', text);

                const phones = extractPhones(text);

                loading.classList.remove('show');

                if (phones.length > 0) {
                    showResult(phones[0]);
                } else {
                    showError('Nenhum telefone detectado. Tente novamente com melhor iluminação e posicionamento, ou digite manualmente.');
                    captureBtn.disabled = false;
                }
            } catch (err) {
                console.error('Erro no OCR:', err);
                showError('Erro ao escanear. Tente novamente.');
                loading.classList.remove('show');
                captureBtn.disabled = false;
            }
        }

        // Extrair números de telefone do texto
        function extractPhones(text) {
            const cleaned = text.replace(/[^\d\s\(\)\-]/g, '');
            
            const patterns = [
                /\(?(\d{2})\)?[\s\-]?(\d{4,5})[\s\-]?(\d{4})/g,
                /(\d{2})[\s\-]?(\d{4,5})[\s\-]?(\d{4})/g,
                /(\d{10,11})/g
            ];

            const phones = [];
            for (const pattern of patterns) {
                const matches = [...cleaned.matchAll(pattern)];
                for (const match of matches) {
                    let phone = match[0].replace(/\D/g, '');
                    
                    if (phone.length === 10 || phone.length === 11) {
                        if (!phone.startsWith('55')) {
                            phone = '55' + phone;
                        }
                        phones.push(phone);
                    }
                }
            }

            return [...new Set(phones)];
        }

        // Formatar telefone para exibição
        function formatPhone(phone) {
            phone = phone.replace(/^55/, '');
            
            if (phone.length === 11) {
                return `(${phone.slice(0,2)}) ${phone.slice(2,7)}-${phone.slice(7)}`;
            } else if (phone.length === 10) {
                return `(${phone.slice(0,2)}) ${phone.slice(2,6)}-${phone.slice(6)}`;
            }
            return phone;
        }

        // Normaliza um número digitado/editado para o formato 55DDNNNNNNNNN
        function normalizePhone(raw) {
            let digits = raw.replace(/\D/g, '');
            if (digits.length === 12 || digits.length === 13) {
                // já tem 55 + DDD + número
                if (digits.startsWith('55')) return digits;
            }
            if (digits.length === 10 || digits.length === 11) {
                return '55' + digits;
            }
            if ((digits.length === 12 || digits.length === 13) && digits.startsWith('55')) {
                return digits;
            }
            return null; // inválido
        }

        // Exibe o painel de resultado com um número já detectado/definido
        function showResult(phone) {
            detectedPhone = phone;
            phoneNumber.textContent = formatPhone(detectedPhone);
            phoneNumber.style.display = 'block';
            phoneInput.style.display = 'none';
            saveEditBtn.style.display = 'none';
            editLink.textContent = '✏️ Editar';
            result.classList.add('show');
            manualEntry.style.display = 'none';
        }

        // Codifica preservando emojis como UTF-8 literal (whatsapp:// não lida bem com %F0%9F...)
        function encodeMessage(text) {
            return text.split('').map(char => {
                const code = char.codePointAt(0);
                if (code > 255) return char;
                return encodeURIComponent(char);
            }).join('');
        }

        // Abrir WhatsApp direto no app
        function openWhatsApp(phone, period) {
            const message = encodeMessage(getRandomMessage(period));
            const appUrl = `whatsapp://send?phone=${phone}&text=${message}`;
            const webUrl = `https://wa.me/${phone}?text=${message}`;

            window.location.href = appUrl;
            setTimeout(() => {
                if (!document.hidden) {
                    window.location.href = webUrl;
                }
            }, 1500);
        }

        // Abrir WhatsApp sem mensagem
        function openWhatsAppNoMessage(phone) {
            const appUrl = `whatsapp://send?phone=${phone}`;
            const webUrl = `https://wa.me/${phone}`;

            window.location.href = appUrl;
            setTimeout(() => {
                if (!document.hidden) {
                    window.location.href = webUrl;
                }
            }, 1500);
        }

        // Abrir discador do telefone
        function openPhoneDialer(phone) {
            let phoneNum = phone.replace(/^55/, '');
            if (phoneNum.length === 11 || phoneNum.length === 10) {
                phoneNum = phoneNum.substring(2);
            }
            window.location.href = `tel:${phoneNum}`;
        }

        // Botões de período
        morningBtn.addEventListener('click', () => {
            openWhatsApp(detectedPhone, 'morning');
        });

        afternoonBtn.addEventListener('click', () => {
            openWhatsApp(detectedPhone, 'afternoon');
        });

        startChatBtn.addEventListener('click', () => {
            openWhatsAppNoMessage(detectedPhone);
        });

        callBtn.addEventListener('click', () => {
            openPhoneDialer(detectedPhone);
        });

        // Novo scan
        newScanBtn.addEventListener('click', () => {
            result.classList.remove('show');
            captureBtn.disabled = false;
            detectedPhone = '';
            status.textContent = 'Câmera pronta';
        });

        // Editar número detectado
        editLink.addEventListener('click', () => {
            phoneInput.value = detectedPhone.replace(/^55/, '');
            phoneNumber.style.display = 'none';
            phoneInput.style.display = 'block';
            saveEditBtn.style.display = 'block';
            phoneInput.focus();
        });

        saveEditBtn.addEventListener('click', () => {
            const normalized = normalizePhone(phoneInput.value);
            if (!normalized) {
                showError('Número inválido. Digite DDD + número (10 ou 11 dígitos).');
                return;
            }
            showResult(normalized);
        });

        // Entrada manual de número (sem escanear)
        manualBtn.addEventListener('click', () => {
            manualEntry.style.display = manualEntry.style.display === 'none' ? 'block' : 'none';
            if (manualEntry.style.display === 'block') {
                manualPhoneInput.focus();
            }
        });

        cancelManualBtn.addEventListener('click', () => {
            manualEntry.style.display = 'none';
            manualPhoneInput.value = '';
        });

        confirmManualBtn.addEventListener('click', () => {
            const normalized = normalizePhone(manualPhoneInput.value);
            if (!normalized) {
                showError('Número inválido. Digite DDD + número (10 ou 11 dígitos).');
                return;
            }
            manualPhoneInput.value = '';
            showResult(normalized);
        });

        // Mostrar erro
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        // Iniciar
        startCamera();
        initTesseract();
    </script>
</body>
</html>
